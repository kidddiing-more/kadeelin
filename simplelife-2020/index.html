    <p>2020 年 11 月 5 日，「2020 Simple Life ORIGINAL 簡單生活節」於華山舉辦記者會。從前期企劃發想、廠商洽詢（氣球、舞台搭設）、音樂人邀約到邀請卡設計規劃，全程參與記者會統籌執行。</p>
    <p>以「byebye 2020」為核心概念，<b>邀請 23 組參演音樂人</b>手持棉花糖、共同施放巨大氣球升空，用輕盈而充滿儀式感的方式，向動盪的一年道別。</p>
